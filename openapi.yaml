openapi: 3.0.3
info:
  title: Arna Business Hub API
  version: 1.0.0
  description: 'Business Hub Service API for Bisnis Naik Kelas: roadmap, checklist,
    Business Vault metadata, score, gamification, goals, calendar, AI insights, and
    integration status.'
